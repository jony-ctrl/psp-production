<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>PSP TV Rotator</title>
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100vw; height:100vh; overflow:hidden; background:#000; }
  iframe { width:100%; height:100%; border:none; display:block; }
  #bar  { position:fixed; bottom:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.08); z-index:9999; }
  #fill { height:100%; width:0%; background:rgba(255,255,255,.35); transition:none; }
  #lbl  { position:fixed; bottom:8px; right:12px; font-family:sans-serif; font-size:11px; color:rgba(255,255,255,.18); z-index:9999; letter-spacing:.04em; }
</style>
</head>
<body>

<iframe id="frame" src="" title="Display"></iframe>
<div id="bar"><div id="fill"></div></div>
<div id="lbl"></div>

<script>
  const DISPLAYS = [
    { url: "https://pspsewinglog.netlify.app/display.html", label: "Sewing Production" },
    { url: "https://admin.pspfab.com/display/safety-covers?key=2i62gFEDfM1H58PEqimJYt7c", label: "Safety Covers" }
  ];
  const DURATION = 30000; // 30 seconds each

  // Get current index from URL hash, default 0
  let idx = parseInt(window.location.hash.replace("#","")) || 0;
  if (idx >= DISPLAYS.length) idx = 0;

  const frame = document.getElementById("frame");
  const fill  = document.getElementById("fill");
  const lbl   = document.getElementById("lbl");

  // Load current display
  frame.src = DISPLAYS[idx].url;
  lbl.textContent = DISPLAYS[idx].label;

  // Animate progress bar
  requestAnimationFrame(() => {
    fill.style.transition = `width ${DURATION}ms linear`;
    fill.style.width = "100%";
  });

  // After duration, reload page with next index in hash
  const nextIdx = (idx + 1) % DISPLAYS.length;
  const timer = setTimeout(() => {
    window.location.href = "rotator.html#" + nextIdx;
  }, DURATION);

  // Keyboard shortcuts
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === " ") {
      clearTimeout(timer);
      window.location.href = "rotator.html#" + nextIdx;
    }
    if (e.key === "ArrowLeft") {
      clearTimeout(timer);
      const prev = (idx - 1 + DISPLAYS.length) % DISPLAYS.length;
      window.location.href = "rotator.html#" + prev;
    }
  });
</script>
</body>
</html>
