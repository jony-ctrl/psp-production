<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PSP — TV Display Rotator</title>
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100vw; height:100vh; overflow:hidden; background:#000; }

  .frame-wrap {
    position: absolute; inset: 0;
    transition: opacity 0.8s ease;
  }
  .frame-wrap.hidden { opacity: 0; pointer-events: none; }
  .frame-wrap.visible { opacity: 1; }

  iframe {
    width: 100%; height: 100%;
    border: none; display: block;
  }

  /* Progress bar at very bottom */
  #progress-bar {
    position: fixed; bottom: 0; left: 0;
    height: 3px; background: rgba(255,255,255,.15);
    width: 100%; z-index: 999;
  }
  #progress-fill {
    height: 100%; width: 0%;
    background: rgba(255,255,255,.4);
    transition: width linear;
  }

  /* Small label showing which display is active */
  #label {
    position: fixed; bottom: 8px; right: 12px;
    font-family: sans-serif; font-size: 11px;
    color: rgba(255,255,255,.2);
    z-index: 999; letter-spacing: .04em;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="frame-wrap visible" id="wrap-0">
  <iframe id="frame-0" src="https://pspsewinglog.netlify.app/display.html" title="Sewing Production"></iframe>
</div>

<div class="frame-wrap hidden" id="wrap-1">
  <iframe id="frame-1" src="https://admin.pspfab.com/display/safety-covers?key=2i62gFEDfM1H58PEqimJYt7c" title="Safety Covers"></iframe>
</div>

<div id="progress-bar"><div id="progress-fill"></div></div>
<div id="label">Sewing Production</div>

<script>
  const DISPLAYS = [
    { id: 0, label: "Sewing Production",  duration: 30 * 1000 }, // 30 sec
    { id: 1, label: "Safety Covers",      duration: 30 * 1000 }, // 30 sec
  ];

  let current = 0;
  let timer = null;
  let startTime = null;

  const fill  = document.getElementById("progress-fill");
  const label = document.getElementById("label");

  function show(index) {
    DISPLAYS.forEach((d, i) => {
      document.getElementById("wrap-" + i).className =
        "frame-wrap " + (i === index ? "visible" : "hidden");
    });
    label.textContent = DISPLAYS[index].label;
    current = index;
    startTimer(DISPLAYS[index].duration);
  }

  function startTimer(duration) {
    clearInterval(timer);
    startTime = Date.now();

    // Animate progress bar
    fill.style.transition = "none";
    fill.style.width = "0%";
    requestAnimationFrame(() => {
      fill.style.transition = `width ${duration}ms linear`;
      fill.style.width = "100%";
    });

    timer = setTimeout(() => {
      const next = (current + 1) % DISPLAYS.length;
      show(next);
    }, duration);
  }

  // Keyboard shortcuts
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === " ") {
      clearTimeout(timer);
      show((current + 1) % DISPLAYS.length);
    }
    if (e.key === "ArrowLeft") {
      clearTimeout(timer);
      show((current - 1 + DISPLAYS.length) % DISPLAYS.length);
    }
  });

  // Start
  show(0);
</script>
</body>
</html>
