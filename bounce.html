<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>PSP TV Bounce</title>
<style>
  body { margin:0; background:#000; }
  #bar  { position:fixed; bottom:0; left:0; width:100%; height:4px; background:rgba(255,255,255,.08); }
  #fill { height:100%; width:0%; background:rgba(255,255,255,.3); }
  #lbl  { position:fixed; bottom:10px; right:14px; font-family:sans-serif; font-size:11px; color:rgba(255,255,255,.2); }
  iframe { width:100vw; height:100vh; border:none; display:block; }
</style>
</head>
<body>
<iframe id="frame" src="" title="Safety Covers"></iframe>
<div id="bar"><div id="fill"></div></div>
<div id="lbl">Safety Covers</div>
<script>
  const DURATION = 30000;
  const SAFETY   = "https://admin.pspfab.com/display/safety-covers?key=2i62gFEDfM1H58PEqimJYt7c";
  const SEWING   = "https://pspsewinglog.netlify.app/display.html";

  document.getElementById("frame").src = SAFETY;

  const fill = document.getElementById("fill");
  requestAnimationFrame(() => {
    fill.style.transition = `width ${DURATION}ms linear`;
    fill.style.width = "100%";
  });

  setTimeout(() => { window.location.href = SEWING; }, DURATION);
</script>
</body>
</html>
